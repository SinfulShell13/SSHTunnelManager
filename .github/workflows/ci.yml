name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Tests/SSHTunnelManager.Tests.csproj
      - name: Build application
        run: dotnet build SSHTunnelManager.csproj -c Release --no-restore
      - name: Test
        run: dotnet test Tests/SSHTunnelManager.Tests.csproj -c Release --no-restore --verbosity normal
